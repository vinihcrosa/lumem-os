sonar.projectKey=vinihcrosa_lumem-os
sonar.organization=vinihcrosa

# This is the name and version displayed in the SonarCloud UI.
#sonar.projectName=lumem-os
#sonar.projectVersion=1.0

# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
#sonar.sources=.

sonar.sourceEncoding=UTF-8

# ---------------------------------------------------------------------------
# O que NÃO é código deste repositório
#
# `sonar.sources` fica no default (`.`), e o que muda a análise é a lista abaixo.
# Ela não é higiene: cada linha aqui é um arquivo onde um achado do Sonar seria
# **inacionável**, e achado inacionável é como se aprende a ignorar a ferramenta.
# ---------------------------------------------------------------------------
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/.turbo/**,\
  packages/cli/bin/**,\
  packages/cli/drizzle/**,\
  packages/server/drizzle/**,\
  packages/web/prototype/**,\
  packages/web/src/styles/tokens.css,\
  packages/web/src/styles/tokens.ts,\
  test-results/**,\
  playwright-report/**

# Por que cada um, na ordem:
#
# - `dist/`, `.turbo/`, `packages/cli/bin|drizzle` — saída de build. Estão no
#   `.gitignore`, então um run no CI nem os vê; a linha existe para o run local
#   dar o mesmo resultado que o do runner, que é a propriedade que faz alguém
#   confiar no relatório.
# - `packages/server/drizzle/**` — as migrações. Elas são **imutáveis por
#   definição**: uma já aplicada não se edita, se sucede. Um aviso de estilo numa
#   migração de três meses atrás não tem conserto possível. (E a `0014` tem uma
#   linha escrita à mão de propósito, com o motivo no comentário dela.)
# - `packages/web/prototype/**`, `tokens.css`, `tokens.ts` — **cópia e derivado
#   do Open Design**, e a regra de design deste repositório é explícita: nenhum
#   dos três se edita à mão, `design:sync` os traz. Analisar cópia é pedir para
#   alguém consertar um arquivo que a próxima sincronização sobrescreve.

# ---------------------------------------------------------------------------
# O que é teste
#
# A suíte é **colocada** — `foo.ts` e `foo.test.ts` lado a lado —, então sem isto
# o Sonar trataria teste como código de produção e cobraria dele as regras
# erradas: duplicação (todo teste repete o arranjo), complexidade cognitiva (uma
# tabela de casos), e "remova este literal". O e2e é diretório próprio.
# ---------------------------------------------------------------------------
sonar.tests=.
sonar.test.inclusions=\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  e2e/**,\
  packages/web/src/test/**,\
  packages/server/src/testing/**

# ---------------------------------------------------------------------------
# Cobertura: deliberadamente ausente
#
# Nenhum pacote gera `lcov` hoje, e apontar `sonar.javascript.lcov.reportPaths`
# para um arquivo que não existe produz um aviso a cada run e **0% de cobertura
# no relatório** — que é pior que nada, porque é um número errado com cara de
# medida.
#
# A matriz de cobertura deste repositório está em `docs/project/testing.md`, e ela
# é por **camada e por propriedade**, não por porcentagem de linha. Ligar cobertura
# aqui é uma decisão de produto de teste, não de configuração: pede escolher o que
# a porcentagem significa antes de exibi-la.
# ---------------------------------------------------------------------------
