sonar.projectKey=vinihcrosa_lumem-os
sonar.organization=vinihcrosa

# This is the name and version displayed in the SonarCloud UI.
#sonar.projectName=lumem-os
#sonar.projectVersion=1.0

# ---------------------------------------------------------------------------
# `sonar.sources` é **obrigatório aqui**, e veio comentado do template
#
# Ele parece redundante — o default é `.`, que é o que está escrito. Não é: o
# default só vale enquanto `sonar.tests` não existe. Com `sonar.tests=.` abaixo
# e esta linha comentada, a árvore inteira é indexada como **teste**, e o log do
# scanner diz exatamente isso:
#
#     229 indexed as test with language 'ts'
#       0 indexed as main
#     DEBUG 'JavaScript/TypeScript Coverage' skipped because there is no
#           related file in current project
#
# Cobertura só existe sobre arquivo *main*. Sem nenhum, o sensor é pulado — e
# **o job fica verde**, porque pular um sensor não é erro. Foi assim que a
# primeira análise com `lcov.info` correto no disco publicou
# `new_lines_to_cover=0`.
#
# Caminho relativo a este arquivo. Replace "\" by "/" on Windows.
# ---------------------------------------------------------------------------
sonar.sources=.

sonar.sourceEncoding=UTF-8

# ---------------------------------------------------------------------------
# O que NÃO é código deste repositório
#
# `sonar.sources` fica no default (`.`), e o que muda a análise é a lista abaixo.
# Ela não é higiene: cada linha aqui é um arquivo onde um achado do Sonar seria
# **inacionável**, e achado inacionável é como se aprende a ignorar a ferramenta.
# ---------------------------------------------------------------------------
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/.turbo/**,\
  packages/cli/bin/**,\
  packages/cli/drizzle/**,\
  packages/server/drizzle/**,\
  packages/web/prototype/**,\
  packages/web/src/styles/tokens.css,\
  packages/web/src/styles/tokens.ts,\
  test-results/**,\
  playwright-report/**

# Por que cada um, na ordem:
#
# - `dist/`, `.turbo/`, `packages/cli/bin|drizzle` — saída de build. Estão no
#   `.gitignore`, então um run no CI nem os vê; a linha existe para o run local
#   dar o mesmo resultado que o do runner, que é a propriedade que faz alguém
#   confiar no relatório.
# - `packages/server/drizzle/**` — as migrações. Elas são **imutáveis por
#   definição**: uma já aplicada não se edita, se sucede. Um aviso de estilo numa
#   migração de três meses atrás não tem conserto possível. (E a `0014` tem uma
#   linha escrita à mão de propósito, com o motivo no comentário dela.)
# - `packages/web/prototype/**`, `tokens.css`, `tokens.ts` — **cópia e derivado
#   do Open Design**, e a regra de design deste repositório é explícita: nenhum
#   dos três se edita à mão, `design:sync` os traz. Analisar cópia é pedir para
#   alguém consertar um arquivo que a próxima sincronização sobrescreve.

# ---------------------------------------------------------------------------
# O que é teste
#
# A suíte é **colocada** — `foo.ts` e `foo.test.ts` lado a lado —, então sem isto
# o Sonar trataria teste como código de produção e cobraria dele as regras
# erradas: duplicação (todo teste repete o arranjo), complexidade cognitiva (uma
# tabela de casos), e "remova este literal". O e2e é diretório próprio.
# ---------------------------------------------------------------------------
sonar.tests=.
sonar.test.inclusions=\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  e2e/**,\
  packages/web/src/test/**,\
  packages/server/src/testing/**

# ---------------------------------------------------------------------------
# Cobertura
#
# O `pnpm test:coverage` escreve este arquivo, e o workflow o gera antes do scan
# — o comentário de por que ele não vem do `ci.yml` está lá.
#
# **O número depende inteiramente do `coverage.include` do `vitest.config.ts`.**
# O provider `v8` instrumenta tudo que o processo carrega, e a suíte carrega os
# bundles de `packages/*/dist` — 186 376 linhas minificadas, 0% por definição.
# Sem aquele `include`, o relatório publicado aqui seria **12%**, com 88% de ramo
# na linha de baixo. Com ele, 94,0%.
#
# As duas listas de exclusão — a daqui e a de lá — concordam de propósito
# (`tokens.ts`, protótipo, saída de build). Cobertura local diferente da
# cobertura do Sonar é como se aprende a não olhar nenhuma das duas.
# ---------------------------------------------------------------------------
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# **Sem `sonar.coverage.exclusions` e sem limiar próprio.** O quality gate do
# SonarQube mede *código novo*, e é essa a métrica que vale: 94,0% como piso
# global transformaria a próxima PR honesta — um arquivo novo ainda mal coberto —
# em vermelho por aritmética, e gate que grita à toa é gate que se aprende a
# ignorar. A matriz por **camada e propriedade** continua em
# `docs/project/testing.md`; a porcentagem é o complemento dela, não a substituta.
