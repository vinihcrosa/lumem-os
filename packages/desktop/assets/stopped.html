<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Lumem parado</title>
    <!-- A página vem com o app e não carrega nada de fora: o daemon não está lá para servi-la.
         Estilo e script são arquivos ao lado dela, e é por isso que o CSP dispensa `unsafe-inline`. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self'; script-src 'self'"
    />
    <link rel="stylesheet" href="stopped.css" />
  </head>
  <body>
    <main>
      <h1>Lumem parado</h1>
      <p id="hint">O daemon não responde.</p>
      <button id="start" type="button">Iniciar</button>
    </main>
    <script src="stopped.js"></script>
  </body>
</html>
