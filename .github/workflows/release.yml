name: Release

# Publica o `lumem` no npm. Roda por tag, e a tag é o único gatilho automático:
# a decisão de publicar é o `git push --tags`, e não um merge que alguém fez sem
# pensar em versão (D6).
#
# O `workflow_dispatch` existe para ensaiar: com `dry_run` ligado ele faz tudo —
# gates, empacotamento, instalação em duas plataformas — e para antes do
# `npm publish`. É o que se roda antes da primeira publicação de verdade, quando
# errar custa um nome que não volta.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "empacota e instala, mas não publica"
        type: boolean
        default: true

# Duas publicações da mesma tag ao mesmo tempo não é um caso que valha resolver
# bem: a segunda perde.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Os mesmos gates do CI, na mesma ordem, antes de empacotar. Se passou aqui e
  # falhou lá, é a máquina que está diferente — não o critério.
  package:
    name: gates e tarball
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      version: ${{ steps.version.outputs.value }}
      tarball: ${{ steps.pack.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm gate:build
      - run: pnpm test

      # A tag e o manifesto têm que dizer a mesma coisa. Publicar `v0.2.0` com
      # `0.1.9` dentro produz um pacote que ninguém consegue relacionar com o
      # commit que o gerou — e `npm publish` não desfaz.
      - name: a versão, conferida contra a tag
        id: version
        run: |
          version="$(node -p "require('./packages/cli/package.json').version")"
          echo "value=$version" >> "$GITHUB_OUTPUT"
          if [ "${{ github.ref_type }}" = "tag" ] && [ "${{ github.ref_name }}" != "v$version" ]; then
            echo "::error::a tag ${{ github.ref_name }} não bate com a versão do pacote ($version)"
            exit 1
          fi

      - name: o tarball
        id: pack
        working-directory: packages/cli
        run: |
          name="$(npm pack --pack-destination "$RUNNER_TEMP" | tail -1)"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          cp "$RUNNER_TEMP/$name" "$GITHUB_WORKSPACE/$name"

      - uses: actions/upload-artifact@v4
        with:
          name: tarball
          path: ${{ steps.pack.outputs.name }}
          retention-days: 7

  # O job que justifica esta pipeline existir.
  #
  # Tudo o que este empacotamento pode ter de errado — dependência com `require`
  # dinâmico, migração fora do `files`, prebuild nativo ausente, `bin` apontando
  # para nada — é invisível para o typecheck, para o vitest e para o e2e, porque
  # os três rodam contra o repositório. Só aparece instalando (D5).
  smoke:
    name: instalar de verdade (${{ matrix.os }})
    needs: package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          name: tarball

      # O tarball recebido, e não um rebuild dele: são para ser idênticos, e o
      # ponto deste job é parar de supor.
      #
      # `npx --yes tsx` em vez de instalar o workspace: instalar aqui traria as
      # dependências de desenvolvimento do repositório para dentro do job que
      # existe justamente para provar que o pacote não precisa delas.
      - run: npx --yes tsx@4 scripts/smoke-install.ts "${{ needs.package.outputs.tarball }}"

  # Não existe mais um job que confere o token, porque não existe mais token.
  #
  # A autenticação é **OIDC (trusted publisher)** desde 2026-09-07: o npm confia
  # neste repositório e neste workflow, e o `publish` troca o token efêmero do
  # Actions por credencial de publicação na hora. O job que existia aqui
  # perguntava `npm whoami` a um segredo — e, pior, perguntava errado:
  # `echo "npm whoami: $(npm whoami)"` devolve o status do `echo`, então um 401
  # passava pelo guarda e morria no `npm publish`. Foi exatamente o que
  # aconteceu na v0.2.0.
  publish:
    name: npm
    needs: [package, smoke]
    if: github.ref_type == 'tag' || inputs.dry_run == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Existe sem reviewer hoje. Exigir aprovação humana passa a ser uma linha na
    # configuração do repositório no dia em que houver uma segunda pessoa (D6).
    environment: npm
    permissions:
      contents: write
      # A credencial. Com trusted publisher, este token é *como* o job se
      # autentica no npm — e é também o que assina a provenance.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # OIDC no `npm publish` pede npm >= 11.5.1, e o Node 22 traz o 10.
      - run: npm install -g npm@latest

      - uses: actions/download-artifact@v4
        with:
          name: tarball

      # Sem `NODE_AUTH_TOKEN`: com trusted publisher, um token no ambiente é o
      # que o npm tenta *primeiro*, e um token velho aí faz o registry responder
      # `404` no `PUT` — que é o 403 dele disfarçado. Também sem `--provenance`:
      # publicando por OIDC ela sai assinada de graça.
      - name: publicar
        run: npm publish "${{ needs.package.outputs.tarball }}" --access public

      - name: a Release, com o tarball anexado
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "${{ needs.package.outputs.tarball }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes
