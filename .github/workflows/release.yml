name: Release

# Publica o `lumem` no npm, e o app de desktop dele (`038`). Roda por tag, e a tag é o único gatilho automático:
# a decisão de publicar é o `git push --tags`, e não um merge que alguém fez sem
# pensar em versão (D6).
#
# O `workflow_dispatch` existe para ensaiar: com `dry_run` ligado ele faz tudo —
# gates, empacotamento, instalação em duas plataformas — e para antes do
# `npm publish`. É o que se roda antes da primeira publicação de verdade, quando
# errar custa um nome que não volta.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "empacota e instala, mas não publica"
        type: boolean
        default: true

# Duas publicações da mesma tag ao mesmo tempo não é um caso que valha resolver
# bem: a segunda perde.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# O `prepare` do `pnpm install` liga o husky (T17 da `024-dev-harness`), e num
# runner não há commit nenhum para ele vigiar.
env:
  HUSKY: 0

jobs:
  # Os mesmos gates do CI, na mesma ordem, antes de empacotar. Se passou aqui e
  # falhou lá, é a máquina que está diferente — não o critério.
  package:
    name: gates e tarball
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      version: ${{ steps.version.outputs.value }}
      tarball: ${{ steps.pack.outputs.name }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm gate:build
      - run: pnpm test

      # A tag e o manifesto têm que dizer a mesma coisa. Publicar `v0.2.0` com
      # `0.1.9` dentro produz um pacote que ninguém consegue relacionar com o
      # commit que o gerou — e `npm publish` não desfaz.
      - name: a versão, conferida contra a tag
        id: version
        run: |
          version="$(node -p "require('./packages/cli/package.json').version")"
          echo "value=$version" >> "$GITHUB_OUTPUT"
          if [ "${{ github.ref_type }}" = "tag" ] && [ "${{ github.ref_name }}" != "v$version" ]; then
            echo "::error::a tag ${{ github.ref_name }} não bate com a versão do pacote ($version)"
            exit 1
          fi
          # Os quatro pacotes do app saem na versão do `package.json` dele, e o `lumem menubar
          # install` pede `<pacote>@<versão do daemon>`: os dois têm que ser o mesmo número.
          desktop="$(node -p "require('./packages/desktop/package.json').version")"
          if [ "$desktop" != "$version" ]; then
            echo "::error::o app de desktop está na versão $desktop e o daemon na $version — rode pnpm version:set"
            exit 1
          fi

      - name: o tarball
        id: pack
        working-directory: packages/cli
        run: |
          name="$(npm pack --pack-destination "$RUNNER_TEMP" | tail -1)"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          cp "$RUNNER_TEMP/$name" "$GITHUB_WORKSPACE/$name"

      - uses: actions/upload-artifact@v4
        with:
          name: tarball
          path: ${{ steps.pack.outputs.name }}
          retention-days: 7

  # O job que justifica esta pipeline existir.
  #
  # Tudo o que este empacotamento pode ter de errado — dependência com `require`
  # dinâmico, migração fora do `files`, prebuild nativo ausente, `bin` apontando
  # para nada — é invisível para o typecheck, para o vitest e para o e2e, porque
  # os três rodam contra o repositório. Só aparece instalando (D5).
  smoke:
    name: instalar de verdade (${{ matrix.os }})
    needs: package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - uses: actions/download-artifact@v4
        with:
          name: tarball

      # O tarball recebido, e não um rebuild dele: são para ser idênticos, e o
      # ponto deste job é parar de supor.
      #
      # `npx --yes tsx` em vez de instalar o workspace: instalar aqui traria as
      # dependências de desenvolvimento do repositório para dentro do job que
      # existe justamente para provar que o pacote não precisa delas.
      - run: npx --yes tsx@4 scripts/smoke-install.ts "${{ needs.package.outputs.tarball }}"

  # O app de desktop (`038` Parte 4): um pacote npm por plataforma e arquitetura.
  #
  # O macOS empacota as duas arquiteturas no runner arm64, e o Linux as duas no runner x64 —
  # o cross-arch que a documentação do electron-builder descreve para `--arm64` num host x64,
  # o que poupa depender de um runner arm64 de Linux só para montar uma pasta.
  #
  # O smoke daqui é o do app que o runner **consegue abrir**: `darwin-arm64` no macOS (a
  # assinatura ad-hoc confere) e `linux-x64` sob `xvfb` (a janela carrega `/menubar`). As
  # outras duas arquiteturas viajam sem esse passo, e o `pnpm smoke:install --only desktop`
  # roda na máquina de quem verifica.
  desktop:
    name: app (${{ matrix.platform }}-${{ matrix.arch }})
    needs: package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, platform: darwin, arch: arm64 }
          - { os: macos-latest, platform: darwin, arch: x64 }
          - { os: ubuntu-latest, platform: linux, arch: x64 }
          - { os: ubuntu-latest, platform: linux, arch: arm64 }
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # O Electron (~100 MB por plataforma) baixa aqui, na primeira vez que alguém o pede, e
      # não no `pnpm install`: é este job que precisa dele.
      - name: o app empacotado, e o pacote npm dele
        run: pnpm --filter @lumem/desktop run pack --platform ${{ matrix.platform }} --arch ${{ matrix.arch }}

      - name: as libs que o Electron pede no Linux
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2t64 libgbm1

      - name: instalar de verdade (o app)
        if: (matrix.platform == 'darwin' && matrix.arch == 'arm64') || (matrix.platform == 'linux' && matrix.arch == 'x64')
        run: pnpm smoke:install --only desktop packages/desktop/release/${{ matrix.platform }}-${{ matrix.arch }}/vinihcrosa-lumem-desktop-${{ matrix.platform }}-${{ matrix.arch }}-${{ needs.package.outputs.version }}.tgz

      # O tarball vai para o `npm publish`, e os `.zip`, `.AppImage` e `.deb` para a release.
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            packages/desktop/release/${{ matrix.platform }}-${{ matrix.arch }}/*.tgz
            packages/desktop/release/assets/*
          retention-days: 7

  # Não existe mais um job que confere o token, porque não existe mais token.
  #
  # A autenticação é **OIDC (trusted publisher)** desde 2026-09-07: o npm confia
  # neste repositório e neste workflow, e o `publish` troca o token efêmero do
  # Actions por credencial de publicação na hora. O job que existia aqui
  # perguntava `npm whoami` a um segredo — e, pior, perguntava errado:
  # `echo "npm whoami: $(npm whoami)"` devolve o status do `echo`, então um 401
  # passava pelo guarda e morria no `npm publish`. Foi exatamente o que
  # aconteceu na v0.2.0.
  publish:
    name: npm
    needs: [package, smoke, desktop]
    if: github.ref_type == 'tag' || inputs.dry_run == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Existe sem reviewer hoje. Exigir aprovação humana passa a ser uma linha na
    # configuração do repositório no dia em que houver uma segunda pessoa (D6).
    environment: npm
    permissions:
      contents: write
      # A credencial. Com trusted publisher, este token é *como* o job se
      # autentica no npm — e é também o que assina a provenance.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org

      # npm@12 requires Node 22.22.2; this runner uses the pinned Node 22.17.1.
      # npm@11.20.0 supports it and satisfies OIDC's npm >= 11.5.1 requirement.
      - run: npm install -g npm@11.20.0

      - uses: actions/download-artifact@v4
        with:
          name: tarball

      # Os quatro pacotes do app, com o que a release anexa. `merge-multiple` junta os quatro
      # artefatos numa pasta só: `desktop/<plataforma>-<arch>/*.tgz` e `desktop/assets/*`.
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: desktop
          merge-multiple: true

      # Os do app **antes** do daemon: quem instala o `lumem` novo e roda `lumem menubar
      # install` na sequência já encontra o pacote do app na versão dele. `--provenance`
      # explícita porque cada pacote do app é uma origem à parte a atestar.
      #
      # Cada pacote precisa existir no npm com o trusted publisher configurado para este
      # workflow antes da primeira tag que o publica — a configuração é da página do pacote,
      # e o primeiro `npm publish` de um nome novo é o que o cria.
      - name: publicar o app (os quatro pacotes)
        run: |
          for tarball in desktop/*/*.tgz; do
            npm publish "$tarball" --access public --provenance
          done

      # Sem `NODE_AUTH_TOKEN`: com trusted publisher, um token no ambiente é o
      # que o npm tenta *primeiro*, e um token velho aí faz o registry responder
      # `404` no `PUT` — que é o 403 dele disfarçado. Também sem `--provenance`:
      # publicando por OIDC ela sai assinada de graça.
      - name: publicar
        run: npm publish "${{ needs.package.outputs.tarball }}" --access public

      - name: a Release, com o tarball anexado
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "${{ needs.package.outputs.tarball }}" \
            desktop/assets/*.zip desktop/assets/*.AppImage desktop/assets/*.deb \
            --title "${{ github.ref_name }}" \
            --generate-notes
