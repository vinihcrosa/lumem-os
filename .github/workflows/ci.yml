name: CI

# Toda PR, contra qualquer branch. Os mesmos gates que rodam na máquina, na mesma
# ordem: se passou aqui e falhou lá, é a máquina que está diferente — não o critério.
#
# Sem filtro de branch de propósito. Com `branches: [main]`, PR encadeada — feature
# que sai de outra feature ainda não mergeada — passava sem CI nenhum, e ninguém
# via, porque a ausência de check não é vermelho: é silêncio. Foi assim que 50
# commits de escrita em disco chegaram a uma PR sem nunca ter rodado em Linux.
on: pull_request

# Um push novo na mesma PR cancela o run anterior: o resultado do commit
# anterior não interessa a ninguém depois que ele deixou de ser o topo.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Playwright lê isto: retenta uma vez, usa o reporter que anota a própria PR,
  # e recusa um `test.only` esquecido.
  CI: "true"

jobs:
  # Rápido e primeiro: typecheck, build e a suíte que não precisa de navegador.
  checks:
    name: typecheck, build e testes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Antes do setup-node, que precisa do pnpm existindo para achar o store.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # `--frozen-lockfile` é o ponto: uma dependência que entrou sem o lock
      # junto falha aqui, e não seis meses depois numa instalação limpa.
      - run: pnpm install --frozen-lockfile

      - run: pnpm gate:build

      - run: pnpm test

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # A suíte cria repositórios de fixture e commita dentro deles — inclusive
      # de dentro de um terminal, no spec da coluna de arquivos. Um runner não
      # tem identidade configurada, e `git commit` recusa sem uma.
      - name: identidade do git, que o runner não tem
        run: |
          git config --global user.name "Lumem CI"
          git config --global user.email "ci@lumem.local"

      # A versão instalada de verdade, e não a do `package.json`: o binário do
      # navegador é casado com ela, e um cache com chave no intervalo `^1.62.1`
      # entregaria browser de uma versão para o Playwright de outra.
      - name: a versão do Playwright, que é a chave do cache
        id: playwright
        run: echo "version=$(node -p "require('./node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      # O download do chromium é o custo fixo deste job, e ele não muda entre
      # runs enquanto a versão não mudar. `restore-keys` de propósito não existe:
      # cache de outra versão seria pior que baixar de novo.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}

      # Os dois passos abaixo eram um só (`install --with-deps chromium`), e ele
      # travou dois runs no mesmo dia — um queimou os 30 minutos do job e morreu
      # sem nunca ter rodado um teste. Separados, o log diz **qual** dos dois
      # parou, que é o que a versão junta não dizia.
      #
      # A causa, medida no log do run cancelado das 02:29 e não suposta: o
      # `install-deps` chama `apt-get`, e o mirror `azure.archive.ubuntu.com`
      # ficou inalcançável. O apt registrou 26 `Ign:` em oito segundos e depois
      # **ficou mudo por 29 minutos** — os repositórios da Microsoft e do Google
      # responderam normalmente no mesmo run, então foi o mirror, não a rede.
      #
      # O `timeout-minutes` aqui não conserta a rede: ele troca meia hora de
      # silêncio por uma falha vermelha em cinco minutos, com log legível. É o
      # que transforma "a pipeline está lenta" em "o mirror caiu".
      - name: libs de sistema do chromium
        timeout-minutes: 5
        run: pnpm exec playwright install-deps chromium

      # Só o chromium: é o único projeto do playwright.config, e baixar os três
      # navegadores custaria minutos por run para nada. Com o cache quente isto
      # confere e sai; é barato o bastante para rodar sempre, e rodar sempre é o
      # que protege de um cache pela metade.
      - name: o binário do chromium
        timeout-minutes: 5
        run: pnpm exec playwright install chromium

      - run: pnpm test:e2e

      # O rastro de uma falha vale mais que o log: o config guarda trace em
      # `retain-on-failure`, e sem isto ele morre com o runner.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          # A suíte pode falhar antes de escrever qualquer um dos dois; um
          # artefato vazio é normal aí, e não um segundo erro para investigar.
          if-no-files-found: ignore
